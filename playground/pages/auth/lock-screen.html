<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndigoKit — Lock screen</title>
  <link rel="stylesheet" href="../../../dist/css/indigokit.css">
  <link rel="stylesheet" href="../../playground.css">
  <script src="../../theme.js"></script>
  <script src="../../assets/lucide.umd.js"></script>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center py-4">
  <div class="position-fixed top-0 end-0 p-3">
    <select class="form-select form-select-sm w-auto" data-theme-switch aria-label="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">

        <div class="text-center mb-4">
          <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary p-4 mb-3">
            <i data-lucide="user" aria-hidden="true" width="32" height="32"></i>
          </span>
          <h1 class="h4 mb-0">Jane Doe</h1>
          <p class="text-body-secondary small mb-1">jane.doe@example.com</p>
          <span class="badge text-bg-secondary">Workspace locked</span>
        </div>

        <div class="card">
          <div class="card-body p-4">
            <form novalidate>
              <div class="mb-4">
                <label class="form-label" for="lock-password">Password</label>
                <input type="password" class="form-control" id="lock-password" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Unlock</button>
            </form>
          </div>
        </div>

        <p class="text-center mt-4 mb-0"><a class="small" href="login.html">Sign in as a different user</a></p>
        <p class="text-center mt-3 mb-0"><a class="small" href="../../index.html">Back to dashboard</a></p>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
