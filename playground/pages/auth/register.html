<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndigoKit — Create account</title>
  <link rel="stylesheet" href="../../../dist/css/indigokit.css">
  <link rel="stylesheet" href="../../playground.css">
  <script src="../../theme.js"></script>
  <script src="../../assets/lucide.umd.js"></script>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center py-4">
  <div class="position-fixed top-0 end-0 p-3">
    <select class="form-select form-select-sm w-auto" data-theme-switch aria-label="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">

        <div class="text-center mb-4">
          <a class="navbar-brand d-inline-flex align-items-center gap-2 fs-5" href="../../index.html">
            <i data-lucide="layers" aria-hidden="true" class="text-primary"></i>
            IndigoKit
          </a>
          <h1 class="h4 mt-3 mb-1">Create your account</h1>
          <p class="text-body-secondary small mb-0">Start your 14-day free trial — no credit card required.</p>
        </div>

        <div class="card">
          <div class="card-body p-4">
            <form novalidate>
              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label class="form-label" for="reg-first">First name</label>
                  <input type="text" class="form-control" id="reg-first" autocomplete="given-name" required>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label" for="reg-last">Last name</label>
                  <input type="text" class="form-control" id="reg-last" autocomplete="family-name" required>
                </div>
                <div class="col-12">
                  <label class="form-label" for="reg-email">Work email</label>
                  <input type="email" class="form-control" id="reg-email" autocomplete="email" aria-describedby="reg-email-help" required>
                  <div class="form-text" id="reg-email-help">We'll send a verification link to this address.</div>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label" for="reg-password">Password</label>
                  <input type="password" class="form-control" id="reg-password" autocomplete="new-password" aria-describedby="reg-pass-help" required>
                  <div class="form-text" id="reg-pass-help">At least 12 characters with letters and numbers.</div>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label" for="reg-confirm">Confirm password</label>
                  <input type="password" class="form-control" id="reg-confirm" autocomplete="new-password" required>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="reg-terms" required>
                    <label class="form-check-label" for="reg-terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                  </div>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary w-100">Create account</button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <p class="text-center text-body-secondary small mt-4 mb-0">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
        <p class="text-center mt-3 mb-0"><a class="small" href="../../index.html">← Back to dashboard</a></p>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
