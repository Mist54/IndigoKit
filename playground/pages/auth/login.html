<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndigoKit — Sign in</title>
  <link rel="stylesheet" href="../../../dist/css/indigokit.css">
  <link rel="stylesheet" href="../../playground.css">
  <script src="../../theme.js"></script>
  <script src="../../assets/lucide.umd.js"></script>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center py-4">
  <div class="position-fixed top-0 end-0 p-3">
    <select class="form-select form-select-sm w-auto" data-theme-switch aria-label="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">

        <div class="text-center mb-4">
          <a class="navbar-brand d-inline-flex align-items-center gap-2 fs-5" href="../../index.html">
            <i data-lucide="layers" aria-hidden="true" class="text-primary"></i>
            IndigoKit
          </a>
          <h1 class="h4 mt-3 mb-1">Sign in to your account</h1>
          <p class="text-body-secondary small mb-0">Enter your credentials to continue to the dashboard.</p>
        </div>

        <div class="card">
          <div class="card-body p-4">
            <form novalidate>
              <div class="mb-3">
                <label class="form-label" for="login-email">Email address</label>
                <input type="email" class="form-control" id="login-email" autocomplete="email" required>
              </div>
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label mb-0" for="login-password">Password</label>
                  <a class="small" href="forgot-password.html">Forgot password?</a>
                </div>
                <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
              </div>
              <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" role="switch" id="login-remember">
                <label class="form-check-label" for="login-remember">Remember me for 30 days</label>
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>

            <div class="d-flex align-items-center gap-3 my-4">
              <hr class="flex-grow-1">
              <span class="text-body-secondary small">or</span>
              <hr class="flex-grow-1">
            </div>

            <button type="button" class="btn btn-outline-secondary w-100">
              <i data-lucide="building-2" aria-hidden="true" class="me-1" width="16" height="16"></i>
              Continue with SSO
            </button>
          </div>
        </div>

        <p class="text-center text-body-secondary small mt-4 mb-0">
          Don't have an account? <a href="register.html">Create one</a>
        </p>
        <p class="text-center mt-3 mb-0"><a class="small" href="../../index.html">← Back to dashboard</a></p>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
