<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndigoKit — Access denied (403)</title>
  <link rel="stylesheet" href="../../../dist/css/indigokit.css">
  <link rel="stylesheet" href="../../playground.css">
  <script src="../../theme.js"></script>
  <script src="../../assets/lucide.umd.js"></script>
</head>
<body class="min-vh-100 d-flex flex-column">
  <!-- Theme switcher -->
  <div class="position-fixed top-0 end-0 p-3 demo-error-theme">
    <select class="form-select form-select-sm w-auto" data-theme-switch aria-label="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <!-- Main content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 text-center">

          <!-- Brand -->
          <a class="navbar-brand d-inline-flex align-items-center gap-2 fs-5 mb-5" href="../../index.html">
            <i data-lucide="layers" aria-hidden="true" class="text-primary"></i>
            IndigoKit
          </a>

          <!-- Error code -->
          <div class="mb-4">
            <span class="display-1 fw-bold text-body-tertiary" aria-hidden="true">403</span>
          </div>

          <!-- Icon -->
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle p-4 mb-4">
            <i data-lucide="shield-off" aria-hidden="true" width="32" height="32" class="text-danger"></i>
          </div>

          <!-- Content -->
          <h1 class="h3 fw-semibold mb-2">Access denied</h1>
          <p class="text-body-secondary mb-4 lead demo-error-lead">
            You don't have permission to view this page. If you believe this is a mistake, contact your workspace administrator.
          </p>

          <!-- Actions -->
          <div class="d-flex justify-content-center gap-3">
            <a href="../../index.html" class="btn btn-primary px-4">
              <i data-lucide="home" aria-hidden="true" class="me-2" width="16" height="16"></i>
              Back to dashboard
            </a>
            <a href="../settings.html" class="btn btn-outline-secondary px-4">
              <i data-lucide="settings" aria-hidden="true" class="me-2" width="16" height="16"></i>
              Account settings
            </a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-body-tertiary small border-top">
    <div class="container">
      <span>&copy; 2026 IndigoKit</span>
    </div>
  </footer>

  <script>lucide.createIcons();</script>
</body>
</html>
