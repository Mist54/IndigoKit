<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndigoKit — Access denied (403)</title>
  <link rel="stylesheet" href="../../../dist/css/indigokit.css">
  <link rel="stylesheet" href="../../playground.css">
  <script src="../../theme.js"></script>
  <script src="../../assets/lucide.umd.js"></script>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center py-4">
  <div class="position-fixed top-0 end-0 p-3">
    <select class="form-select form-select-sm w-auto" data-theme-switch aria-label="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 text-center">

        <a class="navbar-brand d-inline-flex align-items-center gap-2 fs-5 mb-4" href="../../index.html">
          <i data-lucide="layers" aria-hidden="true" class="text-primary"></i>
          IndigoKit
        </a>

        <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger p-3 mb-3">
          <i data-lucide="shield-x" aria-hidden="true" width="24" height="24"></i>
        </span>

        <h1 class="display-4 fw-semibold mb-1">403</h1>
        <h2 class="h4 mb-2">Access denied</h2>
        <p class="text-body-secondary mb-4">You don't have permission to view this page. If you believe this is a mistake, contact your workspace administrator.</p>

        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <a href="../../index.html" class="btn btn-primary">Back to dashboard</a>
          <a href="../settings.html" class="btn btn-outline-secondary">Review your access</a>
        </div>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
